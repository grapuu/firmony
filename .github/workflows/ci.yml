name: Checks
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:peppol
      - run: npm run test:runtime
        env:
          FIRMONY_CAPTURE_DIR: .wrangler/ui
      - run: npm run test:ui
        env:
          FIRMONY_CHROME: /usr/bin/google-chrome
      - run: npm run test:browser
        env:
          FIRMONY_CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: aml-review-layout
          path: |
            .wrangler/screens/*aml-intake*
            .wrangler/screens/*aml-review*
            .wrangler/screens/*aml-archive*
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # Only when something failed, to look at what broke: every run's screenshots (11 to 60 MB) used up the
        # account's free storage of 0,5 GB (GitHub's notice of 20 October 2026).
        if: failure()
        continue-on-error: true
        with:
          name: accounting-layout
          path: .wrangler/screens
          retention-days: 3
